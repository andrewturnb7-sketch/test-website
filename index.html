<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Amor Ester</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #0d0d10;
      color: #f5f0e6;
      text-align: center;
      overflow-x: hidden;
    }

    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-decor .ring-watermark {
      position: absolute;
      bottom: -12vw;
      right: -10vw;
      width: 55vw;
      height: 55vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      border: 2.5vw solid rgba(212, 175, 55, 0.08);
    }

    .bg-decor .rose {
      position: absolute;
      color: rgba(196, 90, 120, 0.16);
    }

    .bg-decor .rose.rose-1 { top: -4vw; left: -4vw; width: 22vw; max-width: 260px; }
    .bg-decor .rose.rose-2 { bottom: 4vh; left: -6vw; width: 18vw; max-width: 220px; transform: rotate(-15deg); }
    .bg-decor .rose.rose-3 { top: 30vh; right: -5vw; width: 16vw; max-width: 190px; transform: rotate(20deg); }

    .rings-falling {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .rings-falling .ring-emoji {
      position: absolute;
      top: -10vh;
      will-change: transform, opacity;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 0 3px rgba(212, 175, 55, 0.3));
    }

    @keyframes fall {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      8% { opacity: 0.9; }
      92% { opacity: 0.9; }
      100% { transform: translateY(120vh) translateX(var(--drift, 20px)) rotate(360deg); opacity: 0; }
    }

    .page-content {
      position: relative;
      z-index: 2;
    }

    header {
      padding: 3rem 1rem 1.5rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      margin: 0;
      letter-spacing: 0.03em;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 8px;
    }

    .gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 6px;
      filter: brightness(0.85);
    }

    .question {
      padding: 3rem 1rem 1rem;
    }

    .question h2 {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      margin: 0 0 2rem;
    }

    .buttons {
      position: relative;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }

    button {
      font-family: inherit;
      font-size: 1.1rem;
      padding: 0.9rem 2.2rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yesBtn {
      background: #d4af37;
      color: #1a1a1a;
      font-weight: bold;
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      background: transparent;
      color: #f5f0e6;
      border: 1px solid rgba(245, 240, 230, 0.5);
      position: relative;
    }

    footer {
      padding: 3rem 1rem 1rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    #reveal {
      display: none;
      padding: 1rem;
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
    }
  </style>
</head>
<body>
  <div class="bg-decor">
    <div class="ring-watermark"></div>
    <svg class="rose rose-1" viewBox="0 0 100 100" fill="currentColor"><g><ellipse cx="50" cy="35" rx="18" ry="26"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(60 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(120 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(180 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(240 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(300 50 50)"/><circle cx="50" cy="50" r="9"/></g></svg>
    <svg class="rose rose-2" viewBox="0 0 100 100" fill="currentColor"><g><ellipse cx="50" cy="35" rx="18" ry="26"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(60 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(120 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(180 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(240 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(300 50 50)"/><circle cx="50" cy="50" r="9"/></g></svg>
    <svg class="rose rose-3" viewBox="0 0 100 100" fill="currentColor"><g><ellipse cx="50" cy="35" rx="18" ry="26"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(60 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(120 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(180 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(240 50 50)"/><ellipse cx="50" cy="35" rx="18" ry="26" transform="rotate(300 50 50)"/><circle cx="50" cy="50" r="9"/></g></svg>
  </div>
  <div class="rings-falling" id="ringsFalling"></div>

  <div class="page-content">
  <header>
    <h1>To Meu Amor Ester</h1>
  </header>

  <div class="gallery">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg/1280px-Tour_Eiffel_Wikimedia_Commons_%28cropped%29.jpg" alt="Eiffel Tower">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Le_sacre_coeur.jpg/1280px-Le_sacre_coeur.jpg" alt="Sacré-Cœur">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Louvre_Museum_Wikimedia_Commons.jpg/1280px-Louvre_Museum_Wikimedia_Commons.jpg" alt="The Louvre">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Arc_de_Triomphe%2C_Paris_21_October_2010.jpg/1280px-Arc_de_Triomphe%2C_Paris_21_October_2010.jpg" alt="Arc de Triomphe">
  </div>

  <div class="question">
    <h2>Are you ready for Paris?</h2>
    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div id="reveal">
      <video src="paris-video.mp4" controls autoplay playsinline style="max-width: 100%; width: 480px; border-radius: 8px;"></video>

      <div id="confirmStep" style="margin-top: 2.5rem;">
        <h2>Are you sure?</h2>
        <div class="buttons" style="height: auto; margin-top: 1rem;">
          <button id="yesBtn2" onclick="showPhoto()">Yes</button>
        </div>
      </div>

      <div id="photoReveal" style="display: none; margin-top: 2rem;">
        <img src="us-photo.jpg" alt="Us" style="max-width: 100%; width: 480px; border-radius: 8px;">
      </div>
    </div>
  </div>

  <footer>Made with love for our trip.</footer>
  </div>

  <script>
    (function spawnFallingRings() {
      const container = document.getElementById('ringsFalling');
      const count = 18;
      for (let i = 0; i < count; i++) {
        const ring = document.createElement('span');
        ring.className = 'ring-emoji';
        ring.textContent = '💍';
        const left = Math.random() * 100;
        const size = 1.1 + Math.random() * 1.4;
        const duration = 9 + Math.random() * 8;
        const delay = -(Math.random() * (duration + count));
        const drift = (Math.random() * 80 - 40) + 'px';
        ring.style.left = left + 'vw';
        ring.style.fontSize = size + 'rem';
        ring.style.animationDuration = duration + 's';
        ring.style.animationDelay = delay + 's';
        ring.style.setProperty('--drift', drift);
        container.appendChild(ring);
      }
    })();

    const noBtn = document.getElementById('noBtn');
    const buttons = document.querySelector('.buttons');

    function dodge() {
      const area = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();
      const maxX = area.width - btn.width;
      const maxY = area.height - btn.height;
      const x = Math.random() * maxX - maxX / 2;
      const y = Math.random() * maxY - maxY / 2;
      noBtn.style.position = 'relative';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', dodge);
    noBtn.addEventListener('touchstart', function (e) {
      e.preventDefault();
      dodge();
    });

    function sayYes() {
      document.getElementById('reveal').style.display = 'block';
      document.querySelector('.buttons').style.display = 'none';
    }

    function showPhoto() {
      document.getElementById('confirmStep').style.display = 'none';
      document.getElementById('photoReveal').style.display = 'block';
    }
  </script>
</body>
</html>
